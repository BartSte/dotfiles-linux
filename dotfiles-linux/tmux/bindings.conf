# vim: ft=tmux
setw -g mode-keys vi

unbind C-b
unbind Up     
unbind Down   
unbind Left   
unbind Right  

set-option -g prefix C-t

# Select the window with the matching number without the prefix.
bind -n M-0 select-window -t :0
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

bind : command-prompt
bind C new-window -c "#{pane_current_path}"
bind a display-popup -E -w 95% -h 90% -T ' Codex sessions ' /home/barts/dotfiles-linux/bin/tmux-codex-picker
bind R source-file ~/.tmux.conf \; display-message "TMUX reloaded"
bind c new-window
bind g choose-session
bind l clear-history \; display-message "History cleared"
bind s split-window -v
bind v split-window -h
bind X run-shell 'session=$(tmux display-message -p "#S") && tmux switch-client -n && tmux kill-session -t "$session"'
bind D run-shell "/home/barts/dotfiles-linux/bin/tsp-worktree-remove '#{session_id}'"

bind -r e select-pane -U 
bind -r n select-pane -D 
bind -r m select-pane -L 
bind -r i select-pane -R 

# Neovim is the primary scrollback viewer. Keep native copy mode as a fallback.
bind [ run-shell -b '/home/barts/code/personal/tmux-scrollback/bin/tmux-scrollback "#{pane_id}"'
bind M-[ copy-mode

# Native copy mode uses the same clipboard provider as Neovim.
set -s copy-command '/home/barts/code/personal/tmux-scrollback/bin/tmux-scrollback --clipboard'
set -s set-clipboard off
bind -T copy-mode-vi BSpace send-keys -X cursor-up
bind -T copy-mode-vi v if-shell -F '#{selection_present}' \
    'send-keys -X clear-selection' 'send-keys -X begin-selection'
bind -T copy-mode-vi C-v if-shell -F '#{selection_present}' \
    'send-keys -X rectangle-toggle' \
    'send-keys -X begin-selection; send-keys -X rectangle-toggle'
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi Y send-keys -X begin-selection \; send-keys -X end-of-line \; send-keys -X copy-selection
bind -T copy-mode-vi + switch-client -T scrollback-clipboard
bind -T scrollback-clipboard y send-keys -X copy-pipe
bind -T copy-mode-vi g switch-client -T scrollback-g
bind -T scrollback-g g send-keys -X history-top

set -s user-keys[0] "\e[21;2~"
set -s user-keys[1] "\e[22;2~"
bind -n User0 next-window
bind -n User1 previous-window
