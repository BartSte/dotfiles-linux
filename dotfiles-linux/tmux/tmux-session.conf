# vim: ft=tmux

# Set the small session marker with colors from Kanagawa Dragon.
hook_color='tmux set -t $name status-left-style'

bind-key -r f display-popup -E -w 95% -h 90% -d '#{pane_current_path}' -T ' Repos and worktrees ' /home/barts/dotfiles-linux/bin/tsp
bind-key -r b display-popup -E -w 95% -h 90% -d '#{pane_current_path}' -T ' Branch worktrees ' /home/barts/dotfiles-linux/bin/tsp-branches

bind-key -r H run-shell "/home/barts/dotfiles-linux/bin/tmux-pi-layout pi" \; switch-client -t "=pi"

bind-key -r M run-shell "tsp ~"
bind-key -r A run-shell "tsp ~/code/work/yml/agentic-workflows/ --hook '$hook_color fg=#b6927b'"
bind-key -r E run-shell "tsp ~/code/work/python/python-package-fr-data-client --hook '$hook_color fg=#a6a69c'"
bind-key -r F run-shell "tsp ~/code/work/python/operational-database --hook '$hook_color fg=#c4b28a'"
bind-key -r G run-shell "tsp ~/code/work/python/python-package-fr-logger --hook '$hook_color fg=#a292a3'"
bind-key -r I run-shell "tsp ~/code/work/python/fleet-diver --hook '$hook_color fg=#87a987'"
bind-key -r K run-shell "tsp ~/code/personal/python/khalorg --hook '$hook_color fg=#c4746e'"
bind-key -r N run-shell "tsp ~/code/work/python/fleet-cleaner-navigation --hook '$hook_color fg=#8ea4a2'"
bind-key -r O run-shell "tsp ~/code/work/python/python-package-fr-tools --hook '$hook_color fg=#8a9a7b'"
bind-key -r P run-shell "tsp ~/code/work/python/python-package-fr-report --hook '$hook_color fg=#8992a7'"
bind-key -r Q run-shell "tsp ~/code/work/python/python-package-fr-pyqt --hook '$hook_color fg=#8ba4b0'"
bind-key -r W run-shell "tsp ~/code/work/yml/.github --hook '$hook_color fg=#b98d7b'"
