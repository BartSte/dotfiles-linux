# vim: ft=tmux
# Slate and ice: a flat top bar with a clear accent for the active window.
BG='#242c3a'
FG='#edf2f7'
MUTED='#bdc8d8'
ACCENT='#9cdeee'
INK='#15212b'
BORDER='#343b49'
ALERT='#ebcb8b'

set-option -g focus-events on

set -g status-position top
set -g status-justify absolute-centre
set -g status-style "fg=$MUTED,bg=$BG,nobold,nounderscore,noreverse"
set -g message-style "fg=$FG,bg=$BORDER"
set -g message-command-style "fg=$ACCENT,bg=$BORDER"

# Project shortcuts set status-left-style's foreground for the small marker.
# The session name keeps the same neutral color in every session.
set -g status-left-length 32
set -g status-left " #[nobold,nounderscore,noreverse]▎#[fg=$FG,bold] #S#[nobold]  "

setw -g window-status-style "fg=$MUTED,bg=$BG,nobold,nounderscore,noreverse"
setw -g window-status-current-style "fg=$INK,bg=$ACCENT,bold,nounderscore,noreverse"
setw -g window-status-format " #I #[fg=$MUTED]#W "
setw -g window-status-current-format "  #I #W  "
setw -g window-status-separator " "
setw -g window-status-activity-style "fg=$FG,bg=$BG"
setw -g window-status-bell-style "fg=$ALERT,bg=$BG,bold"
setw -g window-status-last-style default

setw -g pane-border-style "fg=$BORDER"
setw -g pane-active-border-style "fg=$ACCENT"
setw -g mode-style "fg=$BG,bg=$ACCENT"

set -g status-right-length 64
# Keep style commas outside the conditional format's argument list.
set -g @codex-account-left "#[fg=$MUTED,bg=$BG,nobold,nounderscore,noreverse]"
set -g @codex-account-right " #[fg=$MUTED]· "
set -g status-right "#{?#{==:#{pane_current_command},codex},#{@codex-account-left}#(/home/barts/dotfiles-linux/bin/tmux-codex-account #{pane_pid})#{@codex-account-right},}#[fg=$ACCENT,bg=$BG,bold,nounderscore,noreverse]%H:%M#[nobold]  "
